<!DOCTYPE html>
<html lang="pl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Epoka napoleońska i Kongres Wiedeński</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--paper:#efe3c8;--page:#f7eed8;--ink:#2a1f14;--mut:#6b5a43;--red:#7a1f2b;--gold:#9a7424;--line:#cdb88a;--ok:#2f6b3f;--bad:#9a2a22}
html{scroll-padding-top:12px;scroll-behavior:smooth}*{box-sizing:border-box}
body{margin:0;color:var(--ink);font:17px/1.7 "Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;background:var(--paper) radial-gradient(ellipse at top,#f6ecd2,#e3d2a9)}
header{text-align:center;padding:34px 16px 22px;background:linear-gradient(#3a1218,#5a1b24);color:#f2e3bd;border-bottom:4px double var(--gold)}
header small{letter-spacing:.3em;font-size:12px;text-transform:uppercase;color:#d8bd7c}
header h1{margin:6px 0;font:700 clamp(26px,5vw,42px) "Palatino Linotype",Georgia,serif;letter-spacing:.03em}
header p{margin:0;font-style:italic;color:#e4cf9c}
.app{display:grid;grid-template-columns:210px minmax(0,1fr) 280px;gap:22px;max-width:1380px;margin:0 auto;padding:22px}
main,aside{min-width:0}.sticky{position:sticky;top:14px;align-self:start}
.toc a{display:block;padding:7px 10px;color:var(--ink);text-decoration:none;font-size:15px;border-left:3px solid var(--line)}
.toc a:hover{border-color:var(--red);color:var(--red)}.toc b{color:var(--red)}
.toc h4,.notes h4{margin:0 0 8px;font-variant:small-caps;letter-spacing:.08em;color:var(--red)}
.score{margin-top:12px;padding:10px;border:1px solid var(--line);background:var(--page);text-align:center;font-size:15px}
.page{background:var(--page);border:1px solid var(--line);outline:1px solid var(--line);outline-offset:-7px;padding:26px 32px;margin-bottom:22px;box-shadow:0 3px 12px #4a361a30}
.page h2{margin:0 0 4px;font-size:25px;color:var(--red)}.page h2 span{color:var(--gold);margin-right:8px}
.page h2:after{content:"";display:block;height:1px;margin:8px 0 14px;background:linear-gradient(90deg,var(--gold),transparent)}
.page>p:first-of-type:first-letter{float:left;font-size:3.3em;line-height:.85;padding:4px 8px 0 0;color:var(--red)}
.d{color:var(--red);font-weight:700;font-variant:small-caps;white-space:nowrap}
.t{font-weight:600;border-bottom:1px solid var(--gold)}
.k{display:block;margin:14px 0;padding:10px 16px;border-left:3px solid var(--red);background:#7a1f2b12;font-style:italic}
.fig{margin:16px 0;padding:12px 16px;border:1px dashed var(--gold);font-size:15px;color:var(--mut);background:#fffaf0}
.fig img{display:block;width:100%;max-height:520px;object-fit:contain;background:#2a1f14;border:3px double var(--gold);margin-bottom:10px}.fig b{display:block;color:var(--ink)}.fig a{color:var(--red)}
.q{border-top:1px solid var(--line);padding:16px 0}.q:first-of-type{border-top:0}.q .h{font-weight:700;margin-bottom:8px}
.q small{color:var(--gold);font-variant:small-caps;letter-spacing:.06em}
button,select,input{font:15px "Palatino Linotype",Georgia,serif}
.opt,.btn{display:block;width:100%;text-align:left;margin:6px 0;padding:9px 13px;border:1px solid var(--line);background:#fffaf0;color:var(--ink);cursor:pointer}
.btn{width:auto;background:var(--red);color:#f6e8c4;border-color:var(--red);display:inline-block;text-align:center}
.opt:hover:not(:disabled){border-color:var(--red)}.ok{background:var(--ok)!important;color:#fff!important;border-color:var(--ok)!important}.bad{background:var(--bad)!important;color:#fff!important;border-color:var(--bad)!important}
.fb{margin-top:8px;font-size:15px;color:var(--mut)}
input[type=text],select{padding:8px 10px;border:1px solid var(--line);background:#fffaf0;color:var(--ink)}
.row{display:flex;gap:10px;align-items:center;margin:6px 0;flex-wrap:wrap}.row span{flex:1;min-width:120px}
svg.map{width:100%;height:auto;border:1px solid var(--line);background:#e8d9b4}svg.map .land{fill:#f3e8c9;stroke:#a78b54;stroke-width:1}svg.map circle{fill:var(--red);stroke:#fff;stroke-width:2;cursor:pointer}
svg.map circle:hover{r:9}
.notes textarea{width:100%;min-height:380px;resize:vertical;padding:12px;border:1px solid var(--line);background:#fffaf0;color:var(--ink);font:15px/1.5 Georgia,serif}
.tiny{font-size:12px;color:var(--mut)}
@media(max-width:1050px){.app{grid-template-columns:1fr;padding:12px}.sticky{position:static}.page{padding:20px}}
</style></head><body>

const D=t=>`<span class="d">${t}</span>`,T=t=>`<span class="t">${t}</span>`,K=t=>`<span class="k">${t}</span>`;
const F=(a,b,q,k)=>`<div class="fig">${k?`<img src="${IMG[k]}" alt="${a}">`:""}<b>🖼 ${a}</b>${b} <a href="https://commons.wikimedia.org/w/index.php?search=${encodeURIComponent(q)}" target="_blank" rel="noopener">Zobacz w Wikimedia Commons →</a></div>`;
const SEC=[
["Droga do władzy",`<p>Napoleon Bonaparte, korsykański oficer artylerii, zasłynął w czasie rewolucji. W ${D("1796–1797")} odniósł zwycięstwa w ${T("Italii")}, a w ${D("1798–1799")} poprowadził nieudaną, lecz głośną wyprawę do ${T("Egiptu")}. Francją rządził wtedy słaby ${T("Dyrektoriat")}, więc kiedy Napoleon wrócił, spiskowcy widzieli w nim „szablę” potrzebną do przejęcia władzy.</p>
<p>${D("9 XI 1799")} (${T("18 brumaire'a")}) dokonał ${T("zamachu stanu")} i został ${T("pierwszym konsulem")}. Szybko uporządkował państwo: założył ${T("Bank Francji")} (${D("1800")}), zawarł ${T("konkordat")} z papieżem (${D("1801")}) i ustanowił ${T("Legię Honorową")} (${D("1802")}). W ${D("1804")} ogłosił ${T("Kodeks cywilny")}, zwany ${T("Kodeksem Napoleona")}: równość wobec prawa, nienaruszalność własności, małżeństwo cywilne.</p>
${K("Napoleon zachował zdobycze rewolucji (równość wobec prawa, własność), ale zastąpił wolność polityczną rządami silnej ręki.")}
<p>${D("2 XII 1804")} w katedrze Notre‑Dame został koronowany na ${T("cesarza Francuzów")}. Papież Pius VII był obecny, jednak koronę Napoleon włożył sobie sam – chciał pokazać, że władzę zawdzięcza sobie, a nie Kościołowi.</p>
${F("Obraz: „Koronacja Napoleona”","Jacques‑Louis David, ok. 1805–1807, Luwr, Paryż.","Jacques-Louis David Coronation of Napoleon","c")}
${F("Obraz: „Napoleon przekraczający Alpy”","Jacques‑Louis David, 1801 – propagandowy portret konsula (w rzeczywistości Napoleon przejechał przełęcz na mule).","Napoleon Crossing the Alps David","a")}`],
["Wojny koalicyjne 1805–1807",`<p>Europejskie monarchie tworzyły przeciw Francji kolejne ${T("koalicje")}. Trzecia (${D("1805")}) łączyła ${T("Wielką Brytanię")}, ${T("Austrię")} i ${T("Rosję")}. Na morzu Francuzi przegrali: ${D("21 X 1805")} pod ${T("Trafalgarem")} admirał ${T("Nelson")} (poległ w bitwie) zniszczył flotę francusko‑hiszpańską. Od tej pory Napoleon nie mógł zagrozić inwazją na Anglię.</p>
<p>Na lądzie szło mu znakomicie. W październiku 1805 zmusił pod ${T("Ulm")} wojska austriackie do kapitulacji, a ${D("2 XII 1805")} wygrał pod ${T("Austerlitz")} (dziś Slavkov, Czechy) ${T("bitwę trzech cesarzy")} – Napoleona, Franciszka I i Aleksandra I. Austria podpisała pokój w ${T("Preszburgu")} (${D("26 XII 1805")}).</p>
${K("Austerlitz (1805) uważa się za największe zwycięstwo Napoleona; Trafalgar (1805) przesądził o panowaniu Anglii na morzu.")}
<p>W ${D("1806")} Napoleon utworzył ${T("Związek Reński")} – niemieckie państwa pod swoim protektoratem. Cesarz Franciszek II zrzekł się wtedy tytułu cesarza rzymskiego i ${T("Świętego Cesarstwa Rzymskiego")} przestało istnieć. ${D("14 X 1806")} pod ${T("Jeną i Auerstedt")} rozbił Prusy, w ${D("1807")} pokonał Rosjan pod ${T("Frydlandem")}, a w ${D("lipcu 1807")} zawarł pokój w ${T("Tylży")}.</p>
${F("Obraz: „Bitwa pod Austerlitz”","François Gérard, 1810 – cesarz wydaje rozkazy w czasie bitwy.","François Gérard Battle of Austerlitz painting","s")}`],
["System kontynentalny i Polacy",`<p>Nie mogąc pokonać Anglii na morzu, Napoleon spróbował zdusić ją gospodarczo. Dekretem berlińskim (${D("21 XI 1806")}) ogłosił ${T("blokadę kontynentalną")}: państwa Europy miały zakaz handlu z Brytyjczykami. Blokada szkodziła także samej Europie, wywoływała przemyt i niezadowolenie, a w końcu skłoniła Napoleona do kolejnych wojen, by wymusić jej przestrzeganie.</p>
<p>Na Polaków Napoleon patrzył jak na sojuszników. Już w ${D("1797")} we Włoszech powstały ${T("Legiony Polskie")} gen. Dąbrowskiego (stąd słowa ${T("Mazurka Dąbrowskiego")}). Na mocy pokoju w Tylży powstało ${D("1807")} ${T("Księstwo Warszawskie")} z królem saskim Fryderykiem Augustem I i konstytucją oraz Kodeksem Napoleona. Polacy bili się za Napoleona w całej Europie, np. szarżą pod ${T("Somosierrą")} w Hiszpanii (${D("30 XI 1808")}).</p>
<p>W ${D("1808")} Napoleon wkroczył do ${T("Hiszpanii")}, tronem obdarował brata Józefa, co wywołało powstanie i wyczerpującą ${T("wojnę partyzancką")} (stąd słowo <i>guerilla</i>). W ${D("1809")} pokonał Austrię pod ${T("Wagram")}, a pokój w Schönbrunn powiększył Księstwo Warszawskie.</p>
${K("Księstwo Warszawskie (1807) nie było pełną niepodległością – zależało od Napoleona – ale dało Polakom własne państwo, wojsko i nowoczesne prawo.")}`],
["Wyprawa na Rosję 1812",`<p>Rosja przestała respektować blokadę kontynentalną, więc Napoleon w ${D("czerwcu 1812")} wkroczył do niej z ${T("Wielką Armią")} (ok. 600 tys. żołnierzy z wielu krajów, w tym kilkadziesiąt tysięcy Polaków). Rosjanie unikali wielkiej bitwy i wycofywali się, paląc zapasy (taktyka ${T("spalonej ziemi")}).</p>
<p>${D("7 IX 1812")} doszło do krwawej, nierozstrzygniętej bitwy pod ${T("Borodino")}. Napoleon zajął ${T("Moskwę")}, ale miasto stanęło w płomieniach, a car nie chciał układów. W październiku Wielka Armia zaczęła ${T("odwrót")} w mrozie i głodzie, atakowana przez Kozaków. Przeprawa przez rzekę ${T("Berezynę")} (${D("26–29 XI 1812")}) kosztowała ogromne straty, a z wyprawy wróciła zaledwie garstka żołnierzy.</p>
${K("Klęska w Rosji w 1812 r. złamała potęgę Napoleona – po niej przeciw Francji ponownie zjednoczyła się Europa.")}
${F("Obraz: „Odwrót Napoleona z Moskwy”","Adolph Northen, 1851 – przedstawia cesarza w drodze powrotnej z Rosji.","Adolph Northen Napoleon retreat from Moscow","r")}`],
["Upadek Napoleona",`<p>W ${D("1813")} powstała nowa koalicja (Rosja, Prusy, Austria, Szwecja, Wielka Brytania). Pod ${T("Lipskiem")} (${D("16–19 X 1813")}) rozegrała się ${T("Bitwa Narodów")} – największa dotąd bitwa w historii Europy. Napoleon przegrał, a ostatniego dnia zginął książę ${T("Józef Poniatowski")}, dowódca polskich oddziałów.</p>
<p>Wojska koalicji weszły do Francji; Paryż skapitulował ${D("31 III 1814")}, a Napoleon ${T("abdykował")} (${D("6 IV 1814")}) i trafił na wyspę ${T("Elbę")}. Do Francji wrócili Burbonowie – tron objął ${T("Ludwik XVIII")}.</p>
<p>Napoleon uciekł z Elby, wylądował we Francji ${D("1 III 1815")} i rozpoczął ${T("Sto dni")} rządów. ${D("18 VI 1815")} został ostatecznie pokonany pod ${T("Waterloo")} (dziś Belgia) przez armię brytyjską ${T("Wellingtona")} i pruską ${T("Blüchera")}. Zesłano go na odległą ${T("Wyspę Świętej Heleny")} na Atlantyku, gdzie zmarł ${D("5 V 1821")}.</p>
${K("Waterloo (18 VI 1815) zakończyło epokę napoleońską; Napoleon spędził resztę życia na Wyspie Świętej Heleny.")}`],
["Kongres Wiedeński",`<p>Zwycięzcy chcieli odbudować porządek w Europie. Obrady trwały od ${D("września 1814")} do ${D("9 VI 1815")} (data Aktu Końcowego) w Wiedniu. Uczestniczyli m.in. car ${T("Aleksander I")}, cesarz ${T("Franciszek I")}, król pruski ${T("Fryderyk Wilhelm III")}, a decydowali dyplomaci: ${T("Metternich")} (Austria, przewodniczący), ${T("Castlereagh")} (Wielka Brytania), ${T("Hardenberg")} (Prusy) i ${T("Talleyrand")} – sprytnie broniący interesów pokonanej Francji.</p>
<p>Opierano się na trzech zasadach: ${T("legitymizm")} (powrót „prawowitych” dynastii), ${T("restauracja")} (przywracanie dawnego porządku) i ${T("równowaga sił")} (żadne państwo nie może zdominować Europy). Francję zmniejszono do granic sprzed rewolucji, powstało ${T("Królestwo Niderlandów")} (Holandia + Belgia), Prusy dostały m.in. część Saksonii i Nadrenię, Austria północne Włochy, a ${T("Szwajcaria")} uzyskała gwarancję neutralności. Zamiast Świętego Cesarstwa utworzono luźny ${T("Związek Niemiecki")} (39 państw).</p>
<p>${D("26 IX 1815")} z inicjatywy Aleksandra I Rosja, Austria i Prusy zawarły ${T("Święte Przymierze")} – sojusz monarchów przeciw ruchom rewolucyjnym i liberalnym. Wielka Brytania do niego nie przystąpiła.</p>
${K("Kongres Wiedeński ustanowił na prawie 40 lat ład oparty na legitymizmie i równowadze sił, a Święte Przymierze miało go bronić przed rewolucjami.")}
${F("Rycina: „Kongres Wiedeński”","Rycina Jeana Godefroya według obrazu J.‑B. Isabeya, 1819 – delegaci przy stole obrad (czerwone numery dodano później do identyfikacji postaci).","Congress of Vienna Isabey painting","k")}`],
["Kongres a ziemie polskie",`<p>Księstwo Warszawskie przestało istnieć. Z jego części utworzono ${T("Królestwo Polskie")} (zw. kongresowym) – w ${T("unii personalnej")} z Rosją, z królem Aleksandrem I i liberalną konstytucją (${D("27 XI 1815")}), własnym wojskiem i sejmem. Prusy otrzymały ${T("Wielkie Księstwo Poznańskie")}, a Kraków stał się ${T("Wolnym Miastem")} (${D("1815–1846")}) pod opieką trzech mocarstw. Reszta ziem pozostała w zaborze austriackim (Galicja) i rosyjskim.</p>
${K("Kongres nie przywrócił niepodległej Rzeczypospolitej – Polska pozostała podzielona między trzy mocarstwa.")}`]
];

 else if(x.t=="txt"){v=$("i"+i).value;if(!v.trim())return;ok=x.a.includes(norm(v));$("i"+i).disabled=true;if(!ok)extra=` Poprawna odpowiedź: <b>${x.a[0]}</b>.`}

 done[i]=1;if(ok)pts++;if(x.t=="ord")$("o"+i).innerHTML=ordH(i);
